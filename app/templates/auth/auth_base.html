<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SIF Safety Portal{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { font-family:'Poppins', sans-serif; }
    body {
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:
        radial-gradient(circle at 20% 20%, rgba(127,90,240,0.6), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(44,177,255,0.5), transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(255,95,162,0.3), transparent 50%),
        #0d0b1e;
    }
    .auth-card {
      max-width:420px; width:100%;
      background:rgba(255,255,255,0.14);
      border:1px solid rgba(255,255,255,0.3);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border-radius:24px; padding:38px;
      box-shadow:0 12px 40px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
      color:#fff;
    }
    .auth-card label { color:rgba(255,255,255,0.85); }
    .auth-card .form-control, .auth-card .form-select {
      background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.3); color:#fff;
    }
    .auth-card .form-control::placeholder { color:rgba(255,255,255,0.5); }
    .auth-card .form-control:focus, .auth-card .form-select:focus {
      background:rgba(255,255,255,0.18); border-color:#2CB1FF; box-shadow:0 0 0 .2rem rgba(44,177,255,0.25); color:#fff;
    }
    .auth-card a { color:#8fd7ff; }
    .btn-gradient {
      background:linear-gradient(120deg, #7F5AF0, #2CB1FF); color:#fff; border:none;
      border-radius:14px; padding:11px; font-weight:600;
      box-shadow:0 8px 22px rgba(127,90,240,0.4);
    }
    .btn-gradient:hover { color:#fff; opacity:.92; }
  </style>
</head>
<body>
  <div class="auth-card">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, msg in messages %}
        <div class="alert alert-{{ category }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
