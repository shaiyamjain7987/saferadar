{% extends "auth/auth_base.html" %}
{% block content %}
<h4 class="fw-bold mb-4 text-center"><i class="bi bi-shield-fill-check"></i> Safety Portal Login</h4>
<p class="text-center small mb-3" style="opacity:.8">Worker or Site Incharge</p>
<form method="POST">
  <div class="mb-3"><label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" required placeholder="admin@oil.com or worker1@oil.com"></div>
  <div class="mb-3"><label class="form-label">Password</label>
    <input type="password" name="password" class="form-control" required></div>
  <button type="submit" class="btn btn-gradient w-100 mt-2">Login</button>
</form>
<p class="text-center small mt-3 mb-1" style="opacity:.75">Demo: admin@oil.com / password · worker1@oil.com / password</p>
<p class="text-center mt-2 mb-0">Account nahi hai? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
{% endblock %}
